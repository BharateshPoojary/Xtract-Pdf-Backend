name: Deploy Backend

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
            node-version: 20

      - name: Install pnpm
        run: npm i -g pnpm@10.28.2
        
      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Run lint
        run: pnpm run lint 

      - name: Run tests
        run: pnpm run test

      - name: Run build
        run: pnpm run build

  build-and-push:
      needs: test
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
              username: ${{secrets.DOCKERHUB_USERNAME}}
              password: ${{secrets.DOCKERHUB_TOKEN}}

        - name: Build and push image
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: bharateshpoojary/nest-backend:latest
            cache-from: type=registry,ref=bharateshpoojary/nest-backend:buildcache
            cache-to: type=registry,ref=bharateshpoojary/nest-backend:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.VM_HOST}}
          username: ${{secrets.VM_USER}}
          key: ${{secrets.VM_SSH_KEY}}
          script: |
            cd ~/xtract-pdf
            docker compose pull xtract-backend
            docker compose up -d xtract-backend
            docker compose ps 
            docker image prune -f
